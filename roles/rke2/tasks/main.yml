---
- name: Create RKE2 configuration directory
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Check if RKE2 is already installed
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2 --version
  register: rke2_check
  changed_when: false
  failed_when: false

- name: Download and run RKE2 installer
  block:
    - name: Download RKE2 installation script
      ansible.builtin.get_url:
        url: "{{ rke2_install_script_url }}"
        dest: /tmp/rke2-install.sh
        mode: '0755'
      register: rke2_download

    - name: Set RKE2 version environment variable
      ansible.builtin.set_fact:
        rke2_env:
          INSTALL_RKE2_VERSION: "{{ rke2_version if rke2_version != 'latest' else '' }}"
          INSTALL_RKE2_EXEC: "{{ rke2_mode }} --token {{ rke2_token }} --cluster-cidr {{ rke2_cluster_cidr }} --service-cidr {{ rke2_service_cidr }}"

    - name: Execute RKE2 installer (server)
      ansible.builtin.command:
        cmd: /tmp/rke2-install.sh
      environment: "{{ rke2_env }}"
      register: rke2_install
      changed_when: "'installed successfully' in rke2_install.stderr or 'installed successfully' in rke2_install.stdout"
      failed_when: rke2_install.rc != 0
      when: rke2_mode == 'server'

    - name: Execute RKE2 installer (agent)
      ansible.builtin.shell:
        cmd: |
          export INSTALL_RKE2_URL={{ rke2_agent_server_url }}
          export INSTALL_RKE2_TOKEN={{ rke2_token }}
          /tmp/rke2-install.sh
      register: rke2_install_agent
      changed_when: "'installed successfully' in rke2_install_agent.stderr or 'installed successfully' in rke2_install_agent.stdout"
      failed_when: rke2_install_agent.rc != 0
      when:
        - rke2_mode == 'agent'
        - rke2_agent_server_url | length > 0

    - name: Cleanup install script
      ansible.builtin.file:
        path: /tmp/rke2-install.sh
        state: absent

  when: rke2_check.rc != 0

- name: Create RKE2 config file
  ansible.builtin.copy:
    content: |
      # RKE2 Server Configuration
      token: {{ rke2_token }}
      write-kubeconfig-mode: 0640
      tls-san:
        - {{ ansible_hostname }}
        - {{ ansible_default_ipv4.address }}
      disable:
        {{ rke2_disable_components | to_nice_yaml(indent=2) | indent(2) }}
    dest: "{{ rke2_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: '0600'
  when: rke2_mode == 'server'
  register: rke2_config

- name: Create RKE2 agent config file
  ansible.builtin.copy:
    content: |
      # RKE2 Agent Configuration
      server: {{ rke2_agent_server_url }}
      token: {{ rke2_token }}
    dest: "{{ rke2_config_dir }}/config.yaml"
    owner: root
    group: root
    mode: '0600'
  when: rke2_mode == 'agent'
  register: rke2_agent_config

- name: Enable and start RKE2 service
  ansible.builtin.systemd:
    name: "{{ rke2_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  register: rke2_service
  retries: 3
  delay: 10
  until: rke2_service is succeeded

- name: Wait for RKE2 to be ready
  ansible.builtin.command:
    cmd: "{{ rke2_bin_dir }}/kubectl --kubeconfig={{ rke2_kubeconfig }} get nodes"
  register: k8s_nodes
  until: k8s_nodes.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: rke2_mode == 'server'

- name: Create symbolic link for kubectl
  ansible.builtin.file:
    src: "{{ rke2_bin_dir }}/kubectl"
    dest: /usr/local/bin/kubectl
    state: link
    force: true

- name: Create symbolic link for helm
  ansible.builtin.file:
    src: "{{ rke2_bin_dir }}/helm"
    dest: /usr/local/bin/helm
    state: link
    force: true

- name: Copy kubeconfig to standard location
  ansible.builtin.copy:
    src: "{{ rke2_kubeconfig }}"
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: '0600'
    backup: true
  when: rke2_mode == 'server'

- name: Verify RKE2 installation
  ansible.builtin.command:
    cmd: /usr/local/bin/rke2 --version
  register: rke2_version_check
  changed_when: false
  failed_when: rke2_version_check.rc != 0
